[project]
name = "run-tracker-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fitdecode>=0.10",
    # Unpinned, this silently jumped 0.1.4 -> 0.1.5 on a Docker rebuild, which
    # moved the region setting from module globals onto the client constructor
    # and broke every sync with code 1019. Keep the floor at the constructor API.
    "corosexport>=0.1.5,<0.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "fit-tool>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
